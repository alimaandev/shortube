version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8000"
    depends_on:
      - redis
    volumes:
      - ./output:/app/output
      - ./client_secrets.json:/app/client_secrets.json
      - ./youtube_token.pkl:/app/youtube_token.pkl

  worker:
    build: .
    restart: unless-stopped
    command: python -m shortube.rq_worker
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./output:/app/output
      - ./client_secrets.json:/app/client_secrets.json
      - ./youtube_token.pkl:/app/youtube_token.pkl
      - ./remotion/public:/app/remotion/public

volumes:
  redis_data:
