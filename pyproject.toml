[project]
name = "shortube"
version = "1.0.0"
description = "AI-Powered YouTube Shorts Studio — desktop app"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end smoke tests running a real Remotion render (requires Node.js; gated by SHORTUBE_E2E=1)",
    "network: tests requiring live network/API access",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["remotion", ".opencode"]

[tool.ruff.lint]
# ASYNC230 (blocking calls in async functions) is still deferred for
# shortube/voice.py — see the per-file ignore below.
select = ["E", "F", "I", "UP", "SIM", "B", "DTZ", "PIE", "PLW1510", "S110", "F841", "PERF402", "ASYNC230", "BLE001"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# voice.py still runs file I/O inside its async generation path; fixing it
# requires an async-safe rewrite of that function (tracked as an issue).
"shortube/voice.py" = ["ASYNC230"]
